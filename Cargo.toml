[package]
name = "tpc"
description = "CLI for TeaserPaste"
version = "0.2.3" 
edition = "2024"
authors = ["TeaserPaste"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/TeaserPaste/tpcli"
keywords = ["cli", "tp", "teaserpaste", "cargo"]
documentation = "https://docs.teaserverse.online/triple-tool/teaserpaste/cli"
exclude = ["target/*", ".github/*", "dist-workspace.toml"]

[dependencies]
clap = { version = "4", features = ["derive"] }
inquire = "0.9"
edit = "0.1.5"
ureq = { version = "2.9", features = ["json"] }
keyring = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
directories = "6.0"
arboard = "3.6"
tempfile = "3.24"
regex = "1.12"
colored = "3"
url = "2.5"
comfy-table = "7.2"
chrono = "0.4"
base64 = "0.22"
atty = "0.2.14"
log = "0.4.29"
env_logger = "0.11.8"
shlex = "1.3.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
