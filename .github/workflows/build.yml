# Workflow này sử dụng Matrix để build trên Windows, Linux và macOS
# Sau đó tập hợp tất cả lại để tạo một bản Release duy nhất.

name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  # Job 1: Build binaries cho từng nền tảng
  build:
    name: Build for ${{ matrix.os }}
    strategy:
      matrix:
        # Bạn có thể thêm/bớt các OS tùy nhu cầu
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh

      - name: Run cargo-dist build
        shell: bash
        run: |
          # Build các thành phẩm cho OS hiện tại
          cargo dist build --tag=${{ github.ref_name }} --output-format=json > dist-manifest.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: |
            target/dist/*
            dist-manifest.json

  # Job 2: Gom tất cả lại và tạo Release
  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: artifacts-*
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Thu thập tất cả file từ thư mục artifacts
          files: |
            all-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}